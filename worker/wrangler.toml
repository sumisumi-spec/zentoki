name = "zentoki-license"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "KEYS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set with `npx wrangler secret put NAME`):
#   LICENSE_SECRET      any long random string (HMAC secret for keys)      ← 必須
#   ADMIN_TOKEN         any long random string (for /issue, /revoke, /keys)  ← Airペイ運用で必須
#   STRIPE_SECRET_KEY   sk_live_...   (Stripe を使う場合のみ)
[vars]
ALLOWED_ORIGIN = "https://sumisumi-spec.github.io"
