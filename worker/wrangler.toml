name = "zentoki-license"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "KEYS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set with `npx wrangler secret put NAME`):
#   STRIPE_SECRET_KEY   sk_live_...   (Stripe > Developers > API keys)
#   LICENSE_SECRET      any long random string (HMAC secret for keys)
[vars]
ALLOWED_ORIGIN = "https://sumisumi-spec.github.io"
